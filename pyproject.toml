[project]
name = "ai-digital-workforce"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.134.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-limiter>=4.1.1",
    "gunicorn>=26.2.0 ; sys_platform == 'linux'",
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langchain-ollama>=1.1.0",
    "minio>=7.2.20",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "supabase>=2.32.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "werkzeug>=3.1.9",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
